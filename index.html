<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas Técnicas</title>
<style>
:root{
  --bg:#f3f2ef; --panel:#fff; --ink:#1d1c1a; --muted:#6d6a64; --line:#e2dfd8; --soft:#f8f7f4;
  --accent:#c8372a; --accent-soft:#fbe9e6; --ok:#2e7a4d; --ok-soft:#e5f3ea; --warn:#9a6413; --warn-soft:#fcf1dc;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 8px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:30px;width:38px;cursor:pointer}
textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
label.f > span{white-space:nowrap}
label.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{background:var(--accent-soft);color:var(--accent)}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.tabs{display:flex;gap:2px}
.tabs button{background:transparent;border:0;color:#bdbab4;padding:6px 12px;border-radius:7px;cursor:pointer}
.tabs button:hover{color:#fff}
.tabs button.on{background:#ffffff1f;color:#fff}
.top .sp{flex:1}
.status{font-size:12px;color:#bdbab4;display:flex;align-items:center;gap:8px}
.status b{color:#fff;font-weight:500}
.status .dot{width:7px;height:7px;border-radius:50%;background:#7bd39b}
.status .dot.warn{background:#f0b44c}
.menu{position:relative}
.menu > .btn{background:#ffffff14;border-color:#ffffff2a;color:#fff}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;color:var(--ink);border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;min-width:250px;display:none}
.menu.open .menu-pop{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu-pop button:hover{background:var(--soft)}
.menu-pop small{display:block;color:var(--muted);font-size:11.5px}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* layout */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 52px)}
.side{border-right:1px solid var(--line);background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:10px}
.side .list{display:flex;flex-direction:column;gap:4px;overflow:auto}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:#fff}
.item.on{background:#fff;border-color:var(--line);box-shadow:var(--shadow)}
.item .th{width:38px;height:38px;border-radius:6px;background:#2a2927 center/contain no-repeat;flex:none}
.item .t{font-weight:600;font-size:13px;line-height:1.25}
.item .s{font-size:11.5px;color:var(--muted)}
.content{padding:18px 22px 60px;min-width:0}
.empty{color:var(--muted);text-align:center;padding:80px 20px}

.ed-head{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ed-head .title-input{font-size:22px;font-weight:700;border-color:transparent;background:transparent;padding:4px 6px;flex:1;min-width:220px}
.ed-head .title-input:hover{border-color:var(--line)}
.ed-head select{width:auto}
.grid2{display:grid;grid-template-columns:minmax(320px,1fr) minmax(380px,1fr);gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card > h3{margin:0;padding:12px 14px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.card > h3 .sp{flex:1}
.card .bd{padding:14px}
.fg{display:grid;gap:10px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.hint{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}

/* mockup */
.mock-col{position:sticky;top:66px}
.mock-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:#e7e5e0;border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mock-bar select{width:auto}
.mockbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
.mk{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;border-radius:6px}
.mk img.shirt{display:block;width:100%;height:auto;pointer-events:none}
.mk .art{position:absolute;cursor:grab}
.mk .art img{width:100%;height:100%;display:block;pointer-events:none}
.mk .art.sel{outline:1.5px dashed #ff6a5a;outline-offset:2px}
.mk .art:active{cursor:grabbing}
.mk .lbl{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);background:#000c;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
.mk .gl-v{position:absolute;top:0;bottom:0;border-left:1px dashed #ffffff55;pointer-events:none}
.mk .gl-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #ff6a5a;pointer-events:none}
.mk .gl-h{position:absolute;border-top:1px dashed #ff6a5a88;pointer-events:none}
.mk .scale{position:absolute;bottom:2.5%;left:3%;height:8px;border:2px solid #555;border-top:0;pointer-events:none}
.mk .scale span{position:absolute;bottom:10px;left:0;font-size:11px;color:#444;white-space:nowrap}
.mk .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#0008;color:#fff;font-size:13px}
.ph-box{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:30px;border:1px dashed var(--line);border-radius:8px}

/* estampas */
.art-card{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.art-card.sel{border-color:#e3a59c;box-shadow:0 0 0 3px var(--accent-soft)}
.art-hd{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;background:var(--soft)}
.art-hd .th{width:44px;height:44px;border-radius:6px;background:#2a2927 center/contain no-repeat;flex:none}
.art-hd .t{font-weight:600}
.art-hd .s{font-size:12px;color:var(--muted)}
.art-hd .grow{flex:1;min-width:0}
.badge{font-size:11px;padding:1px 7px;border-radius:20px;background:#e9e6e0;color:#55524c;font-weight:600}
.badge.frente{background:#e3ecf7;color:#2b5b93}
.badge.costas{background:#efe5f6;color:#6a3a8c}
.art-bd{padding:12px 10px;display:grid;gap:12px;border-top:1px solid var(--line)}
.cor-row{border-bottom:1px solid var(--line);padding:7px 0;display:grid;gap:5px}
.cor-l1{display:grid;grid-template-columns:38px minmax(0,1fr) 80px 118px auto;gap:5px;align-items:center}
.cor-l2{display:flex;gap:6px;align-items:center}
.cor-l2 .n{width:38px;flex:none;text-align:center;font-size:12px;color:var(--muted)}
.cor-l2 select{flex:1}
.ord{display:flex}
.x:disabled{opacity:.25;cursor:default;background:transparent;color:var(--muted)}
.film{width:36px;height:36px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;flex:none}
.sw-box{width:38px;height:30px;border:1px solid var(--line);border-radius:6px;display:inline-block}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;gap:8px}
.fcard .ftop{display:flex;gap:8px;align-items:center}
.fcard .sw-big{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);flex:none}

.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
.tbl th{color:var(--muted);font-weight:500;font-size:12px}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-bottom:0}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--soft);border-radius:8px;padding:10px}
.kpi small{color:var(--muted);font-size:11.5px;display:block}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums}
.kpi.good b{color:var(--ok)} .kpi.bad b{color:var(--accent)}

/* modelos */
.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vcard .mk{cursor:default}
.vcard.calib .mk{cursor:crosshair;outline:3px solid var(--accent)}
.pt{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px #0005;pointer-events:none}
.pt span{position:absolute;left:16px;top:-3px;font-size:11px;background:#000b;color:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap}
.calib-msg{background:var(--accent);color:#fff;border-radius:7px;padding:8px 10px;font-size:13px;margin-bottom:8px}

.hidden-input{display:none}
#print{display:none}

@media (max-width:1100px){.grid2{grid-template-columns:1fr}.mock-col{position:static}}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);max-height:260px}
  .content{padding:14px 16px 50px}.views{grid-template-columns:1fr}.c3,.c4{grid-template-columns:1fr 1fr}
  .tabs{order:3;width:100%;overflow:auto}
}

/* ---------- impressão ---------- */
@page{size:A4;margin:11mm}
@media print{
  body{background:#fff;font-size:10.5pt}
  #app{display:none!important}
  #print{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pf{color:#111}
.pf-hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #111;padding-bottom:6px;margin-bottom:10px}
.pf-hd h1{margin:0;font-size:19pt;line-height:1.1}
.pf-hd .meta{text-align:right;font-size:9pt;color:#444}
.pf-hd .code{font-size:13pt;font-weight:700;color:#111}
.pf-mocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pf-mocks figure{margin:0;border:1px solid #ccc;border-radius:6px;padding:6px}
.pf-mocks figcaption{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.pf h2{font-size:10.5pt;text-transform:uppercase;letter-spacing:.6px;margin:12px 0 5px;border-bottom:1px solid #999;padding-bottom:2px}
.pf table{width:100%;border-collapse:collapse;font-size:9pt}
.pf th,.pf td{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}
.pf th{background:#eee}
.pf td.n{text-align:right}
.pf .sw{display:inline-block;width:11px;height:11px;border:1px solid #888;border-radius:2px;vertical-align:-1px;margin-right:4px}
.pf .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf .sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:22px;font-size:9pt}
.pf .sign div{border-top:1px solid #333;padding-top:3px}
.pf .art-blk{break-inside:avoid;margin-bottom:6px}
.pf .films{display:flex;flex-wrap:wrap;gap:6px}
.pf .films figure{margin:0;text-align:center;font-size:8pt}
.pf .films img{height:22mm;max-width:30mm;object-fit:contain;border:1px solid #bbb;background:#fff;display:block}
.pf small{color:#555}
.pf .mk .lbl{font-size:8pt}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><i></i><span id="brandName">Fichas Técnicas</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="produtos">Produtos</button>
      <button data-tab="modelos">Modelos de camiseta</button>
      <button data-tab="tintas">Tintas</button>
      <button data-tab="insumos">Insumos</button>
      <button data-tab="config">Configurações</button>
    </nav>
    <div class="sp"></div>
    <div class="status" id="status"></div>
    <div class="menu" id="fileMenu">
      <button class="btn sm" data-act="menu">Arquivo ▾</button>
      <div class="menu-pop" id="menuPop"></div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="print"></div>
<input type="file" id="fileInput" class="hidden-input">

<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const r1 = n => Math.round(n * 10) / 10;
const fmtCm = n => r1(n).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
const brl = n => (isFinite(n) ? n : 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const pct = n => (isFinite(n) ? n : 0).toLocaleString("pt-BR", { style: "percent", maximumFractionDigits: 1 });
const today = () => new Date().toLocaleDateString("pt-BR");

const TIPOS_TINTA = ["Plastisol", "À base d'água", "Discharge", "Puff", "Glitter", "Metálica", "Outra"];
const CATS = ["Etiqueta de marca", "Etiqueta de composição", "Tag", "Embalagem", "Brinde", "Outro"];
const STATUS = ["Rascunho", "Aprovado", "Em produção", "Arquivado"];
const LADOS = { frente: "Frente", costas: "Costas" };

/* ================= cor (sRGB ↔ CIE Lab, D65) ================= */
function hex2rgb(h) {
  h = String(h || "#999").replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgb2lab([r, g, b]) {
  const lin = c => { c /= 255; return c > 0.04045 ? Math.pow((c + 0.055) / 1.055, 2.4) : c / 12.92; };
  const R = lin(r), G = lin(g), B = lin(b);
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const X = f((R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047), Y = f(R * 0.2126 + G * 0.7152 + B * 0.0722), Z = f((R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883);
  return { L: 116 * Y - 16, a: 500 * (X - Y), b: 200 * (Y - Z) };
}
function lab2hex({ L, a, b }) {
  let y = (L + 16) / 116, x = a / 500 + y, z = y - b / 200;
  const f = t => { const t3 = t * t * t; return t3 > 0.008856 ? t3 : (t - 16 / 116) / 7.787; };
  x = 0.95047 * f(x); y = f(y); z = 1.08883 * f(z);
  const c = v => { v = v > 0.0031308 ? 1.055 * Math.pow(v, 1 / 2.4) - 0.055 : 12.92 * v; return Math.max(0, Math.min(255, Math.round(v * 255))); };
  return "#" + [c(x * 3.2406 - y * 1.5372 - z * 0.4986), c(-x * 0.9689 + y * 1.8758 + z * 0.0415), c(x * 0.0557 - y * 0.2040 + z * 1.0570)].map(v => v.toString(16).padStart(2, "0")).join("");
}
const dE = (p, q) => Math.hypot(p.L - q.L, p.a - q.a, p.b - q.b);
const labTxt = o => `L ${r1(o.L)} · a ${r1(o.a)} · b ${r1(o.b)}`;
const CORES_NOME = [[/vermelh/i, "#d0312d"], [/amarel/i, "#f2c500"], [/verde/i, "#2e9e4f"], [/cian/i, "#00a0d6"], [/azul/i, "#1f4fbf"], [/magenta/i, "#d6177a"],
  [/laranja/i, "#f07a1a"], [/pret|black/i, "#111111"], [/branc|white/i, "#ffffff"], [/cinza|gr[ae]y/i, "#8a8a8a"], [/pele/i, "#e8b48f"], [/marrom/i, "#6b4226"], [/violeta|roxo/i, "#6a3d9a"]];

  return { img: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg), ar: h / w };
}

let state;

const cur = () => state.products.find(p => p.id === ui.productId);
const blankOf = p => state.blanks.find(b => b.id === p?.blankId);
const insumoOf = id => state.insumos.find(i => i.id === id);
const formulaOf = id => id ? state.formulas.find(f => f.id === id) : null;
const compsTxt = comps => comps.map(x => `${fmtCm(x.p)}% ${x.nome.replace(/^[A-Z]?\d+\s*-\s*/, "")}`).join(" + ");
function matchFormula(lab, max = 6) {
  let best = null;
  for (const f of state.formulas) { const d = dE(lab, f); if (d < max && (!best || d < best.d)) best = { f, d }; }
  return best?.f || null;
}
// gramas de tinta de uma cor para a tiragem inteira (consumo × peças × perda)
const gramasCor = p => num(state.config.consumoG) * Math.max(1, num(p.tiragem)) * (1 + num(state.config.perdaPct) / 100);
function custoCorPeca(c) {
  const f = formulaOf(c.formulaId);
  if (f) {
    const porKg = f.comps.reduce((s, x) => s + x.p / 100 * num(state.tintas.find(t => t.nome === x.nome)?.custoKg), 0);
    if (porKg > 0) return num(state.config.consumoG) / 1000 * porKg;
  }
  return num(state.config.custoTintaCor);
}

function target(s) {
  const [t, a, b] = s.split(":");
  const p = cur();
  switch (t) {
    case "p": return p;
    case "art": return p?.estampas.find(x => x.id === a);
    case "cor": return p?.estampas.find(x => x.id === a)?.cores[+b];
    case "pins": return p?.insumos[+a];
    case "cfg": return state.config;
    case "blank": return state.blanks.find(x => x.id === a);
    case "tam": return state.blanks.find(x => x.id === a)?.tamanhos[+b];
    case "view": return state.blanks.find(x => x.id === a)?.views[b];
    case "ins": return state.insumos.find(x => x.id === a);
    case "form": return state.formulas.find(x => x.id === a);
    case "fcomp": return state.formulas.find(x => x.id === a)?.comps[+b];
    case "tb": return state.tintas.find(x => x.id === a);
  }
}
function getF(o, k) { return k === "hCm" ? r1(o.wCm * o.ar) : o[k]; }
function setF(o, k, v) { if (k === "hCm") o.wCm = o.ar ? v / o.ar : o.wCm; else o[k] = v; }

const DB = { name: "fichas-tecnicas", store: "kv" };
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB.name, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB.store);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { try { const d = await idb(); return await new Promise((res, rej) => { const q = d.transaction(DB.store).objectStore(DB.store).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch { return undefined; } }
async function idbSet(k, v) { try { const d = await idb(); await new Promise((res, rej) => { const t = d.transaction(DB.store, "readwrite"); t.objectStore(DB.store).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { console.warn(e); } }

const fsOK = "showSaveFilePicker" in window;
const file = { handle: null, ok: false, name: "", lastWrite: 0, error: "" };
let saveTimer = null;

function save() {
  state.savedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
  renderStatus("saving");
}
async function flush() {
  await idbSet("state", state);
  if (file.handle && file.ok) {
    try {
      const w = await file.handle.createWritable();
      await w.write(JSON.stringify(state)); await w.close();
      file.lastWrite = Date.now(); file.error = "";
    } catch (e) { file.error = "Não consegui gravar o arquivo"; file.ok = false; console.warn(e); }
  }
  renderStatus();
}
function renderStatus(mode) {
  const el = $("#status");
  const t = new Date(state.savedAt || Date.now()).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  if (mode === "saving") { el.innerHTML = `<span class="dot warn"></span>Salvando…`; return; }
  if (file.handle && file.ok) el.innerHTML = `<span class="dot"></span>Salvo em <b>${esc(file.name)}</b> · ${t}`;
  else if (file.handle) el.innerHTML = `<span class="dot warn"></span>${esc(file.error || "Arquivo desconectado")} · <button class="btn sm" data-act="reconnect">Reconectar ${esc(file.name)}</button>`;
  else el.innerHTML = `<span class="dot warn"></span>Salvo só neste navegador · ${t}`;
}
function loadState(s) {
  if (!s || !Array.isArray(s.products)) throw new Error("Arquivo inválido");
  state = s;
  state.config = { ...seedState().config, ...state.config };
  state.tintas ??= []; state.formulas ??= [];
  ui.productId = state.products[0]?.id || null; ui.blankId = state.blanks[0]?.id || null; ui.selArt = null;
}
async function connectNew() {
  try {
    const h = await showSaveFilePicker({ suggestedName: "fichas-tecnicas.json", types: [{ description: "Fichas técnicas", accept: { "application/json": [".json"] } }] });
    file.handle = h; file.ok = true; file.name = h.name; await idbSet("handle", h); await flush();
  } catch (e) { if (e.name !== "AbortError") alert(e.message); }
}
async function openFile() {
  try {
    const [h] = await showOpenFilePicker({ types: [{ description: "Fichas técnicas", accept: { "application/json": [".json"] } }] });
    const s = JSON.parse(await (await h.getFile()).text());
    loadState(s);
    file.handle = h; file.ok = (await h.requestPermission({ mode: "readwrite" })) === "granted"; file.name = h.name;
    await idbSet("handle", h); await idbSet("state", state); render();
  } catch (e) { if (e.name !== "AbortError") alert("Não consegui abrir: " + e.message); }
}
async function reconnect() {
  try {
    file.ok = (await file.handle.requestPermission({ mode: "readwrite" })) === "granted";
    if (!file.ok) return renderStatus();
    let disk = null;
    try { disk = JSON.parse(await (await file.handle.getFile()).text()); } catch {}
    if (disk && (disk.savedAt || 0) > (state.savedAt || 0)) { loadState(disk); await idbSet("state", state); render(); }
    else await flush();
    renderStatus();
  } catch (e) { alert(e.message); }
}
function exportJSON() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: "application/json" }));
  a.download = `fichas-tecnicas-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function pickFile(accept, cb) {
  const inp = $("#fileInput");
  inp.value = ""; inp.accept = accept;
  inp.onchange = () => inp.files[0] && cb(inp.files[0]);
  inp.click();
}
function importJSON() {
  pickFile(".json,application/json", async f => {
    try { loadState(JSON.parse(await f.text())); save(); render(); } catch (e) { alert("Não consegui importar: " + e.message); }
  });
}

/* imagens: reduz para não pesar o arquivo */
function readImage(f, maxDim, keepAlpha) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      let w = im.naturalWidth || 1200, h = im.naturalHeight || 1200;
      const k = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d");
      if (!keepAlpha) { g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); }
      g.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res({ img: keepAlpha ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", 0.88), ar: h / w });
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Imagem inválida")); };
    im.src = url;
  });
}

/* ================= geometria do mockup ================= */
function sizes(b) {
  const ref = b.tamanhos.find(t => t.tam === b.refTam) || b.tamanhos[0];
  return { ref, get: tam => b.tamanhos.find(t => t.tam === tam) || ref };
}
// unidade U = largura da foto. pts guardados como fração (x da largura, y da altura)
function geo(b, v, tam) {
  const P = v?.pts;
  if (!P?.axL || !P?.axR || !P?.gola || !b.tamanhos.length) return null;
  const { ref, get } = sizes(b); const sz = get(tam);
  if (!ref.larg || !sz.larg) return null;
  const wU = Math.hypot(P.axR.x - P.axL.x, (P.axR.y - P.axL.y) * v.ar);
  const s = wU / ref.larg;
  return { s, kx: ref.larg / sz.larg, ky: ref.comp && sz.comp ? ref.comp / sz.comp : ref.larg / sz.larg, ar: v.ar, gx: P.gola.x, gy: P.gola.y * v.ar, sz };
}
function artBox(g, a) {
  const w = a.wCm * g.s * g.kx, h = a.wCm * a.ar * g.s * g.kx;
  const cx = g.gx + (a.offX || 0) * g.s * g.kx, top = g.gy + (a.yCm || 0) * g.s * g.ky;
  return { l: (cx - w / 2) * 100, t: top / g.ar * 100, w: w * 100, h: h / g.ar * 100 };
}
const boxStyle = b => `left:${b.l}%;top:${b.t}%;width:${b.w}%;height:${b.h}%`;
function posText(a) {
  const x = r1(a.offX || 0);
  return `${fmtCm(a.yCm || 0)} cm abaixo da gola · ${x === 0 ? "centralizada" : `${fmtCm(Math.abs(x))} cm à ${x > 0 ? "direita" : "esquerda"} do centro`}`;
}
const dimText = a => `${fmtCm(a.wCm)} × ${fmtCm(a.wCm * a.ar)} cm`;

function mockupHTML(p, lado, tam, o = {}) {
  const b = blankOf(p);
  if (!b) return `<div class="ph-box">Escolha o modelo de camiseta deste produto.</div>`;
  const v = b.views[lado];
  if (!v?.img) return `<div class="ph-box">O modelo “${esc(b.nome)}” ainda não tem foto da ${LADOS[lado].toLowerCase()}.<br>Carregue em “Modelos de camiseta”.</div>`;
  const g = geo(b, v, tam);
  let h = `<div class="mk" data-lado="${lado}"><img class="shirt" src="${v.img}" alt="">`;
  if (!g) return h + `<div class="ph">Esta foto ainda não foi calibrada.<br>Vá em “Modelos de camiseta” e marque axilas e gola.</div></div>`;
  if (o.guides) {
    h += `<div class="gl-v" style="left:${g.gx * 100}%"></div><div class="gl-dot" style="left:${g.gx * 100}%;top:${g.gy / g.ar * 100}%"></div>`;
    h += `<div class="scale" style="width:${10 * g.s * g.kx * 100}%"><span>10 cm</span></div>`;
  }
  for (const a of p.estampas.filter(a => a.lado === lado)) {
    const bx = artBox(g, a);
    h += `<div class="art ${o.interactive && a.id === ui.selArt ? "sel" : ""}" data-id="${a.id}" style="${boxStyle(bx)}"><img src="${a.img}" alt="">${o.labels ? `<span class="lbl">${dimText(a)}</span>` : ""}</div>`;
  }
  return h + `</div>`;
}

/* ================= custos ================= */
function custos(p) {
  const c = state.config, b = blankOf(p);
  const cores = p.estampas.reduce((n, a) => n + a.cores.length + (a.baseBranca ? 1 : 0), 0);
  const telas = cores;
  const linhas = [
    ["Camiseta lisa" + (b ? ` (${b.nome})` : ""), b ? num(b.custo) : 0],
    [`Tinta (${cores} ${cores === 1 ? "cor" : "cores"}${p.estampas.some(a => a.cores.some(x => formulaOf(x.formulaId))) ? ", com fórmulas" : ` × ${brl(c.custoTintaCor)}`})`,
      p.estampas.reduce((s, a) => s + a.cores.reduce((t, x) => t + custoCorPeca(x), 0) + (a.baseBranca ? num(c.custoTintaCor) : 0), 0)],
    [`Telas (${telas} × ${brl(c.custoTela)} ÷ ${p.tiragem || 1} peças)`, telas * num(c.custoTela) / Math.max(1, num(p.tiragem) || 1)],
    ["Insumos (etiquetas, embalagem…)", p.insumos.reduce((s, i) => s + (insumoOf(i.id) ? num(insumoOf(i.id).custo) * num(i.qtd) : 0), 0)],
    ["Mão de obra por peça", num(c.maoDeObra)],
    ["Outros custos", num(p.outros)],
  ];
  const total = linhas.reduce((s, l) => s + l[1], 0);
  const preco = num(p.preco), taxas = preco * num(c.taxasPct) / 100, lucro = preco - total - taxas;
  const div = 1 - (num(c.taxasPct) + num(c.margemAlvoPct)) / 100;
  return { linhas, total, preco, taxas, lucro, margem: preco ? lucro / preco : 0, sugerido: div > 0 ? total / div : NaN, telas };
}

function importBBox() {
  pickFile(".json,application/json", async f => {
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.tintas) && !Array.isArray(d.calibracoes)) throw new Error("não parece um arquivo exportado do BBOXCOLOR");
      const guess = n => /^P\d/i.test(n) ? "Plastisol" : /^T\d/i.test(n) ? "À base d'água" : "";
      const tipo = s => /plast/i.test(s) ? "Plastisol" : /gua/i.test(s) ? "À base d'água" : TIPOS_TINTA.includes(s) ? s : "";
      let nt = 0, ut = 0, nf = 0;
      const upTinta = t => {
        if (!t?.nome) return;
        const ex = state.tintas.find(x => x.nome === t.nome);
        if (ex) { Object.assign(ex, { L: num(t.L), a: num(t.a), b: num(t.b) }); ut++; }
        else { state.tintas.push({ id: uid(), nome: t.nome, L: num(t.L), a: num(t.a), b: num(t.b), tipo: guess(t.nome), custoKg: 0 }); nt++; }
      };
      (d.tintas || []).forEach(upTinta);
      for (const c of d.calibracoes || []) {
        (c.comps || []).forEach(x => x.t && !state.tintas.some(t => t.nome === x.t.nome) && upTinta(x.t));
        const comps = (c.comps || []).map(x => ({ nome: x.t?.nome || x.nome || "", p: num(x.p) }));
        const res = c.res || {};
        const key = JSON.stringify([comps, res.L, res.a, res.b]);
        if (state.formulas.some(x => x.key === key)) continue;
        state.formulas.push({ id: uid(), key, nome: (c.obs || "").trim().slice(0, 40) || compsTxt(comps), L: num(res.L), a: num(res.a), b: num(res.b), comps,
          tipo: tipo(c.tipo || ""), sub: c.sub || "", mesh: c.mesh || "", esp: c.esp || "", obs: c.obs || "", origem: "BBOXCOLOR" });
        nf++;
      }
      save(); render();
      alert(`BBOXCOLOR importado:\n• ${nt} tintas base novas, ${ut} atualizadas\n• ${nf} fórmulas novas`);
    } catch (e) { alert("Não consegui importar: " + e.message); }
  });
}

  pickFile(".json,application/json", async f => {

      if (d.formato !== "ficha-photoshop" || !Array.isArray(d.canais) || !d.canais.length) throw new Error("o arquivo não veio do script “Enviar para a ficha”");

      p.estampas.push(a); ui.selArt = a.id; p.atualizado = Date.now(); save(); render();
      const lig = r.cores.filter(c => c.formulaId).length;
      alert(`Arte importada: ${fmtCm(a.wCm)} × ${fmtCm(a.wCm * a.ar)} cm, ${r.cores.length} cores${r.base ? " + base branca" : ""}.` +

}
const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("imagem de canal inválida")); im.src = src; });
async function processarCanais(d) {
  const imgs = await Promise.all(d.canais.map(c => loadImg(c.png)));
  const W = imgs[0].naturalWidth, H = imgs[0].naturalHeight, N = W * H, LIM = 40;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d", { willReadFrequently: true });
  const chans = [], ignorados = [];
  d.canais.forEach((c, i) => {
    if (/camiseta/i.test(c.nome)) { ignorados.push(c.nome); return; }
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.drawImage(imgs[i], 0, 0, W, H);
    const px = g.getImageData(0, 0, W, H).data, ink = new Uint8Array(N);
    // canal de cor especial: preto = tinta. Canal alfa "áreas mascaradas": branco = tinta.
    const inv = c.tipo === "mascara";
    let cov = 0;
    for (let k = 0; k < N; k++) { const v = inv ? px[k * 4] : 255 - px[k * 4]; ink[k] = v; if (v > LIM) cov++; }
    if (cov > N * 0.85) for (let k = 0; k < N; k++) ink[k] = 255 - ink[k];
    const isBase = /base/i.test(c.nome) && /branc/i.test(c.nome);
    const spot = c.tipo === "spot" && c.hex;
    const hex = isBase ? "#ffffff" : spot ? c.hex : corPorNome(c.nome);
    const lab = spot && Array.isArray(c.lab) ? { L: c.lab[0], a: c.lab[1], b: c.lab[2] } : rgb2lab(hex2rgb(hex));
    chans.push({ c, ink, isBase, hex, lab });
  });
  if (!chans.length) throw new Error("nenhum canal de tinta no arquivo");
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (const { ink } of chans) for (let y = 0; y < H; y++) for (let x = 0, r = y * W; x < W; x++) if (ink[r + x] > LIM) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) throw new Error("os canais estão vazios");
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1, M = cw * ch;
  // simula a impressão: base branca primeiro, depois as cores na ordem dos canais
  const acc = new Float32Array(M * 4);
  for (const k of [...chans.filter(c => c.isBase), ...chans.filter(c => !c.isBase)]) {
    const [R, G, B] = hex2rgb(k.hex);
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const al = k.ink[(y + y0) * W + x + x0] / 255; if (!al) continue;
      const o = (y * cw + x) * 4;
      acc[o] = R * al + acc[o] * (1 - al); acc[o + 1] = G * al + acc[o + 1] * (1 - al); acc[o + 2] = B * al + acc[o + 2] * (1 - al); acc[o + 3] = al + acc[o + 3] * (1 - al);
    }
  }
  const oc = document.createElement("canvas"); oc.width = cw; oc.height = ch;
  const og = oc.getContext("2d"), od = og.createImageData(cw, ch);
  for (let k = 0; k < M; k++) { const A = acc[k * 4 + 3]; if (A > 0) { od.data[k * 4] = acc[k * 4] / A; od.data[k * 4 + 1] = acc[k * 4 + 1] / A; od.data[k * 4 + 2] = acc[k * 4 + 2] / A; } od.data[k * 4 + 3] = A * 255; }
  og.putImageData(od, 0, 0);
  const film = k => {
    const fc = document.createElement("canvas"); fc.width = cw; fc.height = ch;
    const fg = fc.getContext("2d"), fd = fg.createImageData(cw, ch);
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) { const v = 255 - k.ink[(y + y0) * W + x + x0], o = (y * cw + x) * 4; fd.data[o] = fd.data[o + 1] = fd.data[o + 2] = v; fd.data[o + 3] = 255; }
    fg.putImageData(fd, 0, 0);
    const s = Math.min(1, 300 / Math.max(cw, ch)), sc = document.createElement("canvas");
    sc.width = Math.max(1, Math.round(cw * s)); sc.height = Math.max(1, Math.round(ch * s));
    sc.getContext("2d").drawImage(fc, 0, 0, sc.width, sc.height);
    return sc.toDataURL("image/png");
  };
  const cores = chans.filter(k => !k.isBase).map(k => {
    const fm = matchFormula(k.lab);
    const pant = /pantone\s+(.+)/i.exec(k.c.nome);
    return { nome: k.c.nome, pantone: pant ? pant[1] : "", hex: fm ? lab2hex(fm) : k.hex, tipo: TIPOS_TINTA.includes(fm?.tipo) ? fm.tipo : "Plastisol", formulaId: fm?.id || "", film: film(k) };
  });
  const base = chans.find(k => k.isBase);
  return { img: oc.toDataURL("image/png"), ar: ch / cw, wCm: cw / num(d.pxPorCm || 30), cores, base: base ? { film: film(base) } : null, ignorados };
}

function preparoHTML(p) {
  const rows = [];
  p.estampas.forEach(a => a.cores.forEach(x => { const f = formulaOf(x.formulaId); if (f) rows.push({ a, x, f }); }));
  if (!rows.length) return "";
  const gr = gramasCor(p), c = state.config;
  return `<h2>Preparo de tintas · ${p.tiragem} peças × ${fmtCm(c.consumoG)} g + ${fmtCm(c.perdaPct)}% de sobra ≈ ${Math.round(gr)} g por cor</h2>
    <table><tr><th style="width:26%">Cor</th><th>Fórmula</th><th style="width:30%">Pesar</th></tr>
    ${rows.map(({ a, x, f }) => `<tr><td><span class="sw" style="background:${esc(lab2hex(f))}"></span>${esc(x.nome)}<br><small>${esc(a.nome)} · ${esc(f.nome)}</small></td>
      <td>${esc(compsTxt(f.comps))}<br><small>${labTxt(f)}${f.mesh ? " · mesh " + esc(f.mesh) : ""}</small></td>
      <td>${f.comps.map(k => `${Math.round(gr * k.p / 100)} g ${esc(k.nome.replace(/^[A-Z]?\d+\s*-\s*/, ""))}`).join("<br>")}</td></tr>`).join("")}</table>`;
}

function newProduct(copyFrom) {
  const p = copyFrom ? JSON.parse(JSON.stringify(copyFrom)) : {
    codigo: "", nome: "Novo produto", colecao: "", status: "Rascunho", blankId: state.blanks[0]?.id || "", licenca: "", notas: "",
    tiragem: 30, outros: 0, preco: 0, estampas: [], insumos: [],
  };
  p.id = uid(); p.criado = p.atualizado = Date.now();
  if (copyFrom) { p.nome += " (cópia)"; p.status = "Rascunho"; p.estampas.forEach(a => a.id = uid()); }
  state.products.unshift(p); ui.productId = p.id; ui.selArt = null;
  save(); render();
}
function addArt(swapId) {
  pickFile("image/*", async f => {
    try {
      const im = await readImage(f, 2400, true);
      const p = cur();
      if (swapId) { const a = p.estampas.find(x => x.id === swapId); a.img = im.img; a.ar = im.ar; }
      else {
        const lado = ui.lado;
        const a = { id: uid(), nome: f.name.replace(/\.[^.]+$/, ""), lado, img: im.img, ar: im.ar, wCm: lado === "costas" ? 28 : 25, yCm: lado === "costas" ? 8 : 9, offX: 0,
          baseBranca: true, flash: true, malha: "", cura: "", obs: "", cores: [{ nome: "Branco", pantone: "", hex: "#ffffff", tipo: "Plastisol" }] };
        if (a.wCm * a.ar > 38) a.wCm = r1(38 / a.ar);
        p.estampas.push(a); ui.selArt = a.id;
      }
      p.atualizado = Date.now(); save(); render();
    } catch (e) { alert(e.message); }
  });
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  const menu = $("#fileMenu");
  if (!e.target.closest("#fileMenu")) menu.classList.remove("open");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, p = cur();
  const b = state.blanks.find(x => x.id === ui.blankId);
  switch (act) {
    case "menu": menu.classList.toggle("open"); return;
    case "fileNew": menu.classList.remove("open"); return connectNew();
    case "fileOpen": menu.classList.remove("open"); return openFile();
    case "export": menu.classList.remove("open"); return exportJSON();
    case "import": menu.classList.remove("open"); return importJSON();
    case "reconnect": return reconnect();
    case "newProduct": return newProduct();
    case "dupProduct": return newProduct(p);
    case "delProduct":
      if (!confirm(`Excluir “${p.nome}”? Isso não pode ser desfeito (a não ser por um backup).`)) return;
      state.products = state.products.filter(x => x !== p); ui.productId = state.products[0]?.id || null; save(); return render();
    case "openProduct": ui.productId = id; ui.selArt = null; return render();
    case "lado": ui.lado = el.dataset.v; drawMock(); $$(".seg button").forEach(x => x.classList.toggle("on", x.dataset.v === ui.lado)); return;
    case "selArt":
      if (e.target.closest(".x")) return;
      ui.selArt = ui.selArt === id ? null : id;
      if (ui.selArt) ui.lado = p.estampas.find(a => a.id === id).lado;
      return render();
    case "addArt": return addArt();
    case "swapArt": return addArt(id);
    case "delArt":
      if (!confirm("Excluir esta estampa?")) return;
      p.estampas = p.estampas.filter(a => a.id !== id); save(); return render();
    case "center": { const a = target("art:" + id); a.offX = 0; save(); return refreshProduct(); }
    case "addCor": target("art:" + id).cores.push({ nome: "", pantone: "", hex: "#888888", tipo: "Plastisol" }); save(); return render();
    case "delCor": target("art:" + id).cores.splice(+el.dataset.i, 1); save(); return render();
    case "movCor": {
      const cs = target("art:" + id).cores, i = +el.dataset.i, j = i + +el.dataset.d;
      if (j < 0 || j >= cs.length) return;
      [cs[i], cs[j]] = [cs[j], cs[i]]; save(); return render();
    }
    case "importPS": return importPhotoshop();
    case "importBBox": return importBBox();
    case "newFormula": state.formulas.unshift({ id: uid(), nome: "Nova fórmula", L: 50, a: 0, b: 0, comps: [], tipo: "", sub: "", mesh: "", esp: "", obs: "", origem: "" }); save(); return render();
    case "delFormula": {
      const f = formulaOf(id);
      if (!confirm(`Excluir a fórmula “${f.nome}”? As cores ligadas a ela ficam sem fórmula.`)) return;
      state.formulas = state.formulas.filter(x => x !== f);
      state.products.forEach(pr => pr.estampas.forEach(a => a.cores.forEach(c => { if (c.formulaId === id) c.formulaId = ""; })));
      save(); return render();
    }
    case "addComp": formulaOf(id).comps.push({ nome: state.tintas[0]?.nome || "", p: 0 }); save(); return render();
    case "delComp": formulaOf(id).comps.splice(+el.dataset.i, 1); save(); return render();
    case "newTb": state.tintas.push({ id: uid(), nome: "Nova tinta", L: 50, a: 0, b: 0, tipo: "", custoKg: 0 }); save(); return render();
    case "delTb": if (!confirm("Excluir esta tinta base?")) return; state.tintas = state.tintas.filter(t => t.id !== id); save(); return render();
    case "delPins": p.insumos.splice(+el.dataset.i, 1); save(); return render();
    case "print":
      $("#print").innerHTML = fichaHTML(p, ui.printCosts);
      await Promise.all($$("#print img").map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
      return window.print();
    case "newBlank": {
      const nb = { id: uid(), nome: "Novo modelo", fornecedor: "", cor: "", composicao: "", gramatura: "", custo: 0, refTam: "M",
        tamanhos: [{ tam: "P", larg: 0, comp: 0 }, { tam: "M", larg: 0, comp: 0 }, { tam: "G", larg: 0, comp: 0 }, { tam: "GG", larg: 0, comp: 0 }], views: { frente: {}, costas: {} } };
      state.blanks.push(nb); ui.blankId = nb.id; save(); return render();
    }
    case "openBlank": ui.blankId = id; ui.calib = null; return render();
    case "delBlank": {
      const used = state.products.filter(x => x.blankId === b.id).length;
      if (!confirm(used ? `Este modelo é usado em ${used} produto(s), que ficarão sem camiseta. Excluir mesmo assim?` : `Excluir o modelo “${b.nome}”?`)) return;
      state.blanks = state.blanks.filter(x => x !== b); save(); return render();
    }
    case "addTam": b.tamanhos.push({ tam: "", larg: 0, comp: 0 }); save(); return render();
    case "delTam": b.tamanhos.splice(+el.dataset.i, 1); save(); return render();
    case "viewImg": pickFile("image/*", async f => {
      try {
        const im = await readImage(f, 1800, false);
        b.views[el.dataset.lado] = { img: im.img, ar: im.ar, pts: null, aprox: false };
        ui.calib = { blankId: b.id, lado: el.dataset.lado, step: 0, pts: {} };
        save(); render();
      } catch (er) { alert(er.message); }
    }); return;
    case "calib": ui.calib = { blankId: b.id, lado: el.dataset.lado, step: 0, pts: {} }; return render();
    case "calibCancel": ui.calib = null; return render();
    case "newIns": state.insumos.push({ id: uid(), nome: "Novo insumo", categoria: "Outro", custo: 0, fornecedor: "" }); save(); return render();
    case "delIns": {
      const uso = state.products.filter(x => x.insumos.some(i => i.id === id)).length;
      if (!confirm(uso ? `Este insumo está em ${uso} produto(s). Excluir mesmo assim?` : "Excluir este insumo?")) return;
      state.insumos = state.insumos.filter(i => i.id !== id); save(); return render();
    }
  }
});

// calibração: cliques na foto
document.addEventListener("click", e => {
  const mk = e.target.closest(".mk[data-calib]");
  if (!mk || !ui.calib || mk.dataset.calib !== ui.calib.lado) return;
  const r = mk.getBoundingClientRect();
  const c = ui.calib;
  c.pts[CALIB[c.step][0]] = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  c.step++;
  if (c.step >= CALIB.length) {
    const v = state.blanks.find(x => x.id === c.blankId).views[c.lado];
    v.pts = c.pts; v.aprox = false; ui.calib = null; save();
  }
  render();
});

$("#tabs").addEventListener("click", e => { const t = e.target.closest("button")?.dataset.tab; if (t) { ui.tab = t; ui.calib = null; render(); } });

document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "search") { ui.search = el.value; return renderList(); }
  if (el.id === "tamSel") { ui.tam = el.value; return drawMock(); }
  if (el.id === "guides") { ui.guides = el.checked; return drawMock(); }

  if (el.id === "addIns") { if (el.value) { cur().insumos.push({ id: el.value, qtd: 1 }); save(); render(); } return; }
  if (!el.dataset.k) return;
  const o = target(el.dataset.s); if (!o) return;
  const v = el.type === "checkbox" ? el.checked : el.type === "number" ? num(el.value) : el.value;
  setF(o, el.dataset.k, v);
  const t = el.dataset.s.split(":")[0];
  // escolher a fórmula traz a cor medida e o tipo de tinta dela
  if (t === "cor" && el.dataset.k === "formulaId" && v) {
    const f = formulaOf(v);
    if (f) { o.hex = lab2hex(f); if (TIPOS_TINTA.includes(f.tipo)) o.tipo = f.tipo; }
  }
  save();
  if ((t === "form" || t === "tb") && "Lab".includes(el.dataset.k)) {
    const sw = $(`[data-sw="${el.dataset.s}"]`); if (sw) sw.style.background = lab2hex(o);
  }

  if (el.dataset.rerender) return render();
  if (["p", "art", "cor", "pins"].includes(t)) return refreshProduct();
  if (t === "cfg" && el.dataset.k === "loja") $("#brandName").textContent = `${v} · Fichas Técnicas`;
  if (t === "blank" && el.dataset.k === "refTam") return render();
});

  if (ui.tab === "tintas" && e.target.dataset.s?.startsWith("tb:") && k === "nome") render();
  // a cor mudou: reordena as fórmulas pela proximidade (ΔE)
  if (ui.tab === "produtos" && e.target.dataset.s?.startsWith("cor:") && k === "hex") render();
});

/* ================= arrastar estampa ================= */
document.addEventListener("pointerdown", e => {
  const artEl = e.target.closest("#mock .art");
  if (!artEl) return;
  e.preventDefault();
  const p = cur(), a = p.estampas.find(x => x.id === artEl.dataset.id);
  const b = blankOf(p), g = geo(b, b.views[ui.lado], ui.tam);
  const mk = artEl.parentElement, rect = mk.getBoundingClientRect();
  const st = { x: e.clientX, y: e.clientY, offX: a.offX || 0, yCm: a.yCm || 0 };
  const wasSel = ui.selArt === a.id;
  let moved = false;
  ui.selArt = a.id;
  $$("#mock .art").forEach(x => x.classList.toggle("sel", x === artEl));
  artEl.setPointerCapture(e.pointerId);
  const move = ev => {
    const dx = (ev.clientX - st.x) / rect.width, dy = (ev.clientY - st.y) / rect.width;
    if (Math.abs(ev.clientX - st.x) + Math.abs(ev.clientY - st.y) > 2) moved = true;
    let ox = r1(st.offX + dx / (g.s * g.kx));
    if (Math.abs(ox) < 0.8) ox = 0;
    a.offX = ox; a.yCm = Math.max(0, r1(st.yCm + dy / (g.s * g.ky)));
    artEl.setAttribute("style", boxStyle(artBox(g, a)));
    syncForm();
  };
  const up = () => {
    artEl.removeEventListener("pointermove", move); artEl.removeEventListener("pointerup", up); artEl.removeEventListener("pointercancel", up);
    if (moved) { p.atualizado = Date.now(); save(); }
    if (!wasSel) render(); else if (moved) refreshProduct();
  };
  artEl.addEventListener("pointermove", move); artEl.addEventListener("pointerup", up); artEl.addEventListener("pointercancel", up);
});
document.addEventListener("keydown", e => {
  if (ui.tab !== "produtos" || !ui.selArt || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  const a = target("art:" + ui.selArt); if (!a || a.lado !== ui.lado) return;
  const d = { ArrowLeft: [-0.5, 0], ArrowRight: [0.5, 0], ArrowUp: [0, -0.5], ArrowDown: [0, 0.5] }[e.key];
  if (!d) return;
  e.preventDefault();
  a.offX = r1((a.offX || 0) + d[0]); a.yCm = Math.max(0, r1((a.yCm || 0) + d[1]));
  save(); refreshProduct();
});

/* ================= início ================= */
(async function init() {
  const s = await idbGet("state");
  try { if (s) loadState(s); else throw 0; } catch { state = seedState(); ui.productId = state.products[0].id; ui.blankId = state.blanks[0].id; await idbSet("state", state); }
  if (fsOK) {
    const h = await idbGet("handle");
    if (h) { file.handle = h; file.name = h.name; try { file.ok = (await h.queryPermission({ mode: "readwrite" })) === "granted"; } catch { file.ok = false; } }
  }
  ui.selArt = null;
  render();
})();
</script>
